# Native Doors messages managed by RCUI in namespace rcdoors.
# <native> preserves the selected language and upstream localization patches.
# Each native key has a .text leaf so keys with child keys remain distinct in YAML.
# Replace a value to override it centrally; retain positional {0}, {1}, ... tokens.
# Native Text keeps its existing typed colors/click actions; MiniMessage styling is flattened.
prefix: ''
legacy-prefixes: []
removed-paths: []

