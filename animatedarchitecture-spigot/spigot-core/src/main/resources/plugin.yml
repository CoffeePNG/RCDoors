name: RCDoors
main: nl.pim16aap2.animatedarchitecture.spigot.core.AnimatedArchitecturePlugin
version: ${rcdoors.plugin.version}
author: pim16aap2
contributors:
  - RepubliCraft
description: RepubliCraft's RCDoors fork of AnimatedArchitecture for Paper 26.2.
api-version: 26.2
provides:
  - AnimatedArchitecture
depend:
  - RCPlatform
  - RCUI
  - Vault
libraries:
  - it.unimi.dsi:fastutil:${dependency.fastutil.version}
  - com.alibaba:fastjson:${dependency.fastjson.version}
  - net.bytebuddy:byte-buddy:${dependency.bytebuddy.version}
  - org.flywaydb:flyway-core:${dependency.flyway.version}

commands:
  rcdoorfees:
    description: Inspect and reconcile durable native door creation payments.
    permission: rcdoors.fees.admin
permissions:
  rcdoors.fees.admin:
    description: Record observed creation payment and structure outcomes.
    default: op
