name: Build and stage RCDoors

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Finish an upload before starting another run for the same branch.
concurrency:
  group: rcdoors-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RCDoors
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: RCDoors
      - uses: https://github.com/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the required Maven version
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz \
            -o "$RUNNER_TEMP/maven.tar.gz"
          echo "bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
      - name: Install the YAML parser for plugin descriptors
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-yaml
      - name: Test the deployment script
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check out RCPlatform build dependency
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.BUILD_DEPENDENCIES_TOKEN }}
          persist-credentials: false
          repository: RepubliCraft/RCPlatform
          ref: main
          path: RCPlatform
      - name: Build and install RCPlatform dependency
        run: mvn --batch-mode --no-transfer-progress -f ../RCPlatform/pom.xml -pl rcplatform-api,contracts/rccomputers-api,contracts/rcfire-api,contracts/rchealth-api,contracts/rcheists-api,contracts/rcjobs-api,contracts/rclockpick-api,contracts/rcphone-api,contracts/rcpolice-api,contracts/rcregion-api,contracts/rcorganization-api,contracts/rcbusiness-api,contracts/rcenterprises-api -am clean install
      - name: Check out RCUI build dependency
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.BUILD_DEPENDENCIES_TOKEN }}
          persist-credentials: false
          repository: RepubliCraft/RCUI
          ref: main
          path: RCUI
      - name: Build and install RCUI dependency
        run: mvn --batch-mode --no-transfer-progress -f ../RCUI/pom.xml clean install
      - name: Build and test the plugin
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Select the deployable plugin JAR
        run: python3 scripts/prepare_artifact.py animatedarchitecture-spigot/spigot-packager/target RCDoors dist/RCDoors.jar
      - name: Retain the tested JAR for recovery
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # Forgejo-compatible v4
        with:
          name: RCDoors-${{ forgejo.sha }}
          path: RCDoors/dist/RCDoors.jar
          if-no-files-found: error
          retention-days: 30
      - name: Stage the latest main build in Pterodactyl
        if: ${{ success() && forgejo.ref == 'refs/heads/main' && (forgejo.event_name == 'push' || forgejo.event_name == 'workflow_dispatch') }}
        env:
          PTERODACTYL_URL: https://wpdpanel01l230.vhosts.win
          PTERODACTYL_SERVER_ID: 6c2b7716
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$latest"
          if [ "$latest" != "$(git rev-parse HEAD)" ]; then
            echo "A newer commit is on main; this older build will not be uploaded."
            exit 0
          fi
          python3 scripts/deploy_pterodactyl.py dist/RCDoors.jar
