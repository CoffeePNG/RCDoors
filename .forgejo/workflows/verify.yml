name: Forward tested RCDoors

on:
  push:
    branches: [codex/prebuilt]
  workflow_dispatch:

concurrency:
  group: rcdoors-panel-upload
  cancel-in-progress: false

jobs:
  forward:
    if: ${{ forgejo.ref == 'refs/heads/codex/prebuilt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the small deployment dependency
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends python3-yaml
          fi
      - name: Verify and forward the locally tested JAR
        env:
          PTERODACTYL_URL: https://wpdpanel01l230.vhosts.win
          PTERODACTYL_SERVER_ID: 6c2b7716
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
        run: python3 scripts/forward_prebuilt.py
