name: Test, build, and upload RCDoors

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

  workflow_dispatch:

env:
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS"
  # RCPlatform is not published to any Maven repository, so the API is built from source here. Bump this once
  # RCPlatform starts tagging releases, so that a change on its default branch cannot alter an RCDoors build.
  RCPLATFORM_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # spigot-core compiles against net.republicraft.platform:rcplatform-api, which is not published anywhere.
      # A local `mvn install` of RCPlatform is what makes an RCDoors build work on a developer machine, so the
      # same install runs here. Without it every module from spigot-core onwards fails to resolve.
      - name: Check out RCPlatform
        uses: actions/checkout@v4.2.2
        with:
          repository: CoffeePNG/RCPlatform
          ref: ${{ env.RCPLATFORM_REF }}
          token: ${{ secrets.RCPLATFORM_TOKEN }}
          path: .rcplatform

      - name: Install the RCPlatform API into the local Maven repository
        run: mvn --batch-mode -f .rcplatform/pom.xml -pl rcplatform-api -am -DskipTests install

      - name: Build the project and run static analysis tools.
        run: mvn --batch-mode -P=errorprone clean test install checkstyle:checkstyle pmd:check -Dactions.run.id=$GITHUB_RUN_ID -Dactions.run.number=$GITHUB_RUN_NUMBER

      - name: Build the javadocs
        run: mvn --batch-mode -P=docs -DskipTests install antrun:run lombok:delombok javadoc:javadoc javadoc:aggregate
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')

      - name: Upload RCDoors
        uses: actions/upload-artifact@v4
        with:
          name: RCDoors
          path: animatedarchitecture-spigot/spigot-packager/target/RCDoors.jar
          if-no-files-found: error
          compression-level: 0

      - name: Deploy Javadoc
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: target/reports/apidocs
          target-folder: javadoc
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
